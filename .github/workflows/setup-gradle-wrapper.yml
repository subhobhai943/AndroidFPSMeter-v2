name: Setup Gradle Wrapper

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'gradle/wrapper/gradle-wrapper.properties'

jobs:
  setup-wrapper:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Check if wrapper jar exists
        id: check_jar
        run: |
          if [ -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Gradle wrapper JAR already exists"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Gradle wrapper JAR not found, will generate it"
          fi
      
      - name: Generate Gradle wrapper
        if: steps.check_jar.outputs.exists == 'false'
        run: |
          # Download Gradle distribution
          wget https://services.gradle.org/distributions/gradle-8.5-bin.zip -O gradle.zip
          unzip -q gradle.zip
          
          # Generate wrapper using downloaded Gradle
          ./gradle-8.5/bin/gradle wrapper --gradle-version 8.5
          
          # Clean up
          rm -rf gradle-8.5 gradle.zip
      
      - name: Verify wrapper jar
        if: steps.check_jar.outputs.exists == 'false'
        run: |
          if [ -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "✅ Gradle wrapper JAR successfully generated"
            ls -lh gradle/wrapper/gradle-wrapper.jar
          else
            echo "❌ Failed to generate wrapper JAR"
            exit 1
          fi
      
      - name: Configure Git
        if: steps.check_jar.outputs.exists == 'false'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
      
      - name: Commit and push wrapper jar
        if: steps.check_jar.outputs.exists == 'false'
        run: |
          git add gradle/wrapper/gradle-wrapper.jar
          git commit -m "chore: Add Gradle wrapper JAR [skip ci]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Success message
        if: steps.check_jar.outputs.exists == 'false'
        run: |
          echo "🎉 Gradle wrapper JAR has been successfully added to the repository!"
          echo "You can now use the build and release workflow."
